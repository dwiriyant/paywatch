services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paywatch
      POSTGRES_PASSWORD: paywatch
      POSTGRES_DB: paywatch
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paywatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  paywatch:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      ADDR: ":8081"
      DATABASE_URL: postgres://paywatch:paywatch@postgres:5432/paywatch?sslmode=disable
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      QRISGATE_BASE_URL: ${QRISGATE_BASE_URL:-http://host.docker.internal:8080}
      QRISGATE_ADMIN_TOKEN: ${QRISGATE_ADMIN_TOKEN:-}
      DRY_RUN: ${DRY_RUN:-true}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-6000}
      CACHE_DIR: /tmp/cache
      SEEN_STATE_PATH: /tmp/.paywatch_seen.json
    ports:
      - "8081:8081"
    volumes:
      - paywatch-cache:/tmp/cache
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  paywatch-cache:
